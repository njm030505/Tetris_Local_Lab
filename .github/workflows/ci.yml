name: Java 21 tests and coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Run all tests, actual TCP tests and 70% line coverage gate
        shell: pwsh
        run: ./test-local.ps1 -VerifyCoverage -RequireNetwork
