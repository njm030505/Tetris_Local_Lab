name: Java CI with Gradle

# main 브랜치에 코드가 푸시되거나 Pull Request가 열릴 때 실행
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # 가상의 리눅스 환경에서 실행

    steps:
    - name: 저장소 코드 불러오기 (Checkout)
      uses: actions/checkout@v4

    - name: Java 21 환경 세팅
      uses: actions/setup-java@v4
      with:
        java-version: '21' # 요구사항에 맞춘 버전
        distribution: 'temurin'

    - name: Gradle 실행 권한 부여
      run: chmod +x gradlew

    - name: 단위 테스트 실행 (기능 검증)
      run: ./gradlew test

    # 2. 테스트가 통과했을 때만 커버리지를 검사합니다.
    - name: 라인 커버리지 50% 이상 달성 검증
      run: ./gradlew jacocoTestCoverageVerification