plugins {
    id 'java'
    id 'application'
    id 'jacoco' // 테스트 코드 커버리지 측정을 위한 플러그인
}

group = 'team4' // 프로젝트에 맞게 변경 가능
version = '0.2.2'

java {
    // 요구사항에 명시된 Java 21 버전
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

repositories {
    mavenCentral()
}

dependencies {
    // 단위 테스트를 위한 JUnit 5 라이브러리 추가
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // 테스트 실행 후 자동으로 커버리지 리포트 생성
    afterSuite { desc, result ->
        if (desc.parent == null) {
            println "Tests: ${result.testCount}, Passed: ${result.successfulTestCount}, Failed: ${result.failedTestCount}, Skipped: ${result.skippedTestCount}"
        }
    }
    // 테스트가 실제 사용자 데이터를 건드리지 않게 하는 설정
    systemProperty 'tetris.dataDir', layout.buildDirectory.dir('test-data').get().asFile.path
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test // 리포트 생성 전 반드시 테스트를 먼저 실행
    reports {
        html.required = true
        xml.required = true // 추후 GitHub Actions 연동 시 활용하기 위해 xml도 켜둡니다.
    }
    
}

// 라인 커버리지 70% 이상 요구사항 충족을 검증하는 규칙
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70 // 전체 작성 코드70% 미만 시 빌드 실패
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
application { mainClass = 'phase3.ui.LocalMain' }
check.dependsOn jacocoTestCoverageVerification
